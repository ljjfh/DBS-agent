name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  unit:
    runs-on: ubuntu-latest
    env:
      LLM_PROVIDER: offline           # CI never calls a real model or ASR
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r tests/requirements.txt
      - run: python -m unittest discover tests -v
      - name: Hard safety checks (no unsigned execution, every attack blocked)
        run: python eval/run_eval.py
      - name: Transaction contract fault injection
        run: python eval/run_contract_eval.py
